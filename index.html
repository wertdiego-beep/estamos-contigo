<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Plataforma de gestión de casos — Programa Estamos Contigo, Defensoría a Víctimas de Delitos Violentos, Gobierno Regional Metropolitano de Santiago">
<meta name="theme-color" content="#0e3a6b">
<title>Estamos Contigo · Plataforma de Gestión de Casos</title>
<style>
/* ============================================================
   TOKENS — paleta validada (light/dark)
   ============================================================ */
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axisline:#c3c2b7;
  --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.16);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-100:#cde2fb; --seq-150:#b7d3f6; --seq-200:#9ec5f4; --seq-250:#86b6ef; --seq-300:#6da7ec; --seq-350:#5598e7;
  --seq-400:#3987e5; --seq-450:#2a78d6; --seq-500:#256abf; --seq-550:#1c5cab; --seq-600:#184f95; --seq-650:#104281; --seq-700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --brand:#0d366b; --brand-2:#1c5cab;
  --wash:#f0efec;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.06);
  --shadow-lg:0 4px 10px rgba(11,11,11,.08),0 14px 40px rgba(11,11,11,.14);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axisline:#383835;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#0ca30c;
    --brand:#9ec5f4; --brand-2:#86b6ef;
    --wash:#232322;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axisline:#383835;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-text:#0ca30c;
  --brand:#9ec5f4; --brand-2:#86b6ef;
  --wash:#232322;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 4px 10px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--page); color:var(--ink-1);
  font-size:14.5px; line-height:1.45;
  min-height:100vh;
}
button{font:inherit; cursor:pointer; color:inherit; background:none; border:none}
input,select,textarea{font:inherit; color:var(--ink-1)}
a{color:var(--brand-2); text-decoration:none}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px; border-radius:4px}
::placeholder{color:var(--ink-3)}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* ============================================================
   LOGIN
   ============================================================ */
#login-screen{
  min-height:100vh; display:flex; align-items:stretch;
}
.login-hero{
  flex:1.05; background:linear-gradient(160deg,#0d366b 0%,#1c5cab 55%,#256abf 100%);
  color:#fff; padding:56px; display:flex; flex-direction:column; justify-content:space-between;
  position:relative; overflow:hidden;
}
.login-hero::after{
  content:""; position:absolute; right:-120px; bottom:-120px; width:420px; height:420px;
  border-radius:50%; background:rgba(255,255,255,.06);
}
.login-hero::before{
  content:""; position:absolute; right:40px; bottom:60px; width:220px; height:220px;
  border-radius:50%; background:rgba(255,255,255,.05);
}
.gore-tag{display:flex; align-items:center; gap:12px; font-size:13px; letter-spacing:.4px; opacity:.92}
.gore-tag .crest{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:0}
.login-hero h1{font-size:clamp(28px,3.6vw,44px); line-height:1.12; font-weight:700; max-width:520px; margin-top:18px}
.login-hero .sub{margin-top:14px; font-size:15.5px; opacity:.85; max-width:480px}
.hero-feats{display:flex; flex-direction:column; gap:10px; font-size:13.5px; position:relative; z-index:1}
.hero-feats div{display:flex; gap:10px; align-items:center; opacity:.9}
.hero-feats svg{flex:none}
.login-panel{
  flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:48px 32px; gap:6px;
}
.login-card{width:min(430px,100%)}
.login-card h2{font-size:22px; margin-bottom:4px}
.login-card>p{color:var(--ink-2); margin-bottom:22px}
.role-cards{display:flex; flex-direction:column; gap:10px; margin-bottom:20px}
.role-card{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  padding:13px 16px; transition:border-color .15s, box-shadow .15s, transform .05s;
}
.role-card:hover{border-color:var(--s1); box-shadow:var(--shadow)}
.role-card[aria-pressed="true"]{border-color:var(--s1); box-shadow:0 0 0 1px var(--s1) inset, var(--shadow)}
.role-card .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.role-card .rc-name{font-weight:600}
.role-card .rc-role{font-size:12.5px;color:var(--ink-2)}
.role-card .rc-scope{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--border-strong); border-radius:9px;
  background:var(--surface-1);
}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--ink-3)}
.req::after{content:" *"; color:var(--critical); font-weight:700}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 18px; border-radius:9px; font-weight:600; border:1px solid transparent;
  transition:filter .15s, background .15s;
}
.btn-primary{background:var(--seq-550); color:#fff}
:root[data-theme="dark"] .btn-primary, :root:where(:not([data-theme="light"])) .btn-primary{background:var(--seq-500)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-secondary{background:var(--surface-1); border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--wash)}
.btn-ghost{color:var(--ink-2); padding:8px 12px}
.btn-ghost:hover{background:var(--wash); color:var(--ink-1)}
.btn-danger{background:var(--critical); color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.login-foot{margin-top:26px; font-size:12px; color:var(--ink-3); text-align:center; line-height:1.6}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:none; min-height:100vh}
#app.on{display:grid; grid-template-columns:246px 1fr}
.sidebar{
  background:var(--surface-1); border-right:1px solid var(--border);
  padding:18px 12px; display:flex; flex-direction:column; gap:2px;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:30;
}
.side-brand{display:flex; gap:10px; align-items:center; padding:4px 10px 16px}
.side-brand .crest{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,var(--seq-550),var(--seq-400));color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}
.side-brand b{font-size:14.5px; display:block; line-height:1.15}
.side-brand span{font-size:10.5px; color:var(--ink-3); letter-spacing:.3px}
.nav-sec{font-size:10.5px; font-weight:700; letter-spacing:.8px; color:var(--ink-3); padding:14px 12px 5px; text-transform:uppercase}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:8.5px 12px; border-radius:9px;
  color:var(--ink-2); font-weight:500; font-size:13.5px; width:100%; text-align:left; position:relative;
}
.nav-item:hover{background:var(--wash); color:var(--ink-1)}
.nav-item.active{background:var(--wash); color:var(--brand); font-weight:650}
.nav-item.active::before{content:""; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--seq-450)}
.nav-item svg{flex:none; opacity:.85}
.nav-badge{margin-left:auto; background:var(--critical); color:#fff; font-size:10.5px; font-weight:700; border-radius:99px; padding:1px 7px}
.side-user{margin-top:auto; border-top:1px solid var(--border); padding-top:12px; display:flex; align-items:center; gap:10px; padding-left:8px}
.side-user .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.side-user b{font-size:13px; display:block; line-height:1.2}
.side-user span{font-size:11px; color:var(--ink-3)}

.main{display:flex; flex-direction:column; min-width:0}
.topbar{
  display:flex; align-items:center; gap:14px; padding:12px 26px;
  background:var(--surface-1); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:25;
}
.hamburger{display:none}
.searchbox{position:relative; flex:1; max-width:430px}
.searchbox input{width:100%; padding:8.5px 12px 8.5px 36px; border-radius:99px; border:1px solid var(--border-strong); background:var(--page)}
.searchbox svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
.search-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface-1);
  border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden; display:none; max-height:340px; overflow-y:auto;
}
.search-results.on{display:block}
.sr-item{display:block; width:100%; text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px}
.sr-item:hover{background:var(--wash)}
.sr-item b{display:block}
.sr-item span{color:var(--ink-2); font-size:12px}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:6px}
.conn-pill{
  display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600;
  padding:5px 12px; border-radius:99px; border:1px solid var(--border);
}
.conn-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.conn-pill.off .dot{background:var(--warning)}
.conn-pill .sync-n{background:var(--warning); color:#4a3400; border-radius:99px; padding:0 6px; font-size:11px; font-weight:800}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--wash); color:var(--ink-1)}
.icon-btn .bubble{position:absolute; top:5px; right:5px; min-width:16px; height:16px; padding:0 4px; background:var(--critical); border-radius:99px; color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; border:2px solid var(--surface-1)}

.content{padding:24px 26px 60px; max-width:1440px; width:100%; margin:0 auto}
.page-head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:20px}
.page-head h2{font-size:21px; letter-spacing:-.2px}
.page-head .pg-sub{color:var(--ink-2); font-size:13px; margin-top:3px}
.page-head .actions{margin-left:auto; display:flex; gap:9px; flex-wrap:wrap}

/* ============================================================
   COMPONENTES
   ============================================================ */
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h3{font-size:14.5px; margin-bottom:2px}
.card .card-sub{font-size:12px; color:var(--ink-3); margin-bottom:12px}
.grid{display:grid; gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:1120px){.g-4{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g-4,.g-3,.g-2,.g-2-1,.g-1-2{grid-template-columns:1fr}}

.stat-tile{padding:16px 18px; display:flex; flex-direction:column; gap:2px}
.stat-tile .st-label{font-size:12.5px; color:var(--ink-2); font-weight:600}
.stat-tile .st-value{font-size:30px; font-weight:650; letter-spacing:-.5px; line-height:1.1; margin-top:2px}
.stat-tile .st-delta{font-size:12px; font-weight:600; display:flex; gap:5px; align-items:center; margin-top:3px; color:var(--ink-2)}
.stat-tile .up{color:var(--good-text)} .stat-tile .down{color:var(--critical)}
.stat-tile .st-foot{font-size:11.5px; color:var(--ink-3); margin-top:2px}

.chip{display:inline-flex; align-items:center; gap:6px; padding:2.5px 10px; border-radius:99px; font-size:11.5px; font-weight:650; border:1px solid transparent; white-space:nowrap}
.chip .cdot{width:7px;height:7px;border-radius:50%}
.chip-outline{border-color:var(--border-strong); color:var(--ink-2); background:var(--surface-1)}

table.dt{width:100%; border-collapse:collapse; font-size:13px}
.dt th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--ink-3); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--grid); white-space:nowrap;
}
.dt td{padding:10px 12px; border-bottom:1px solid var(--grid); vertical-align:middle}
.dt tbody tr{transition:background .1s}
.dt tbody tr:hover{background:var(--wash)}
.dt tbody tr.rowlink{cursor:pointer}
.dt .num{text-align:right; font-variant-numeric:tabular-nums}
.dt td .td-main{font-weight:600}
.dt td .td-sub{font-size:11.5px; color:var(--ink-3)}
.table-scroll{overflow-x:auto}

.filters-row{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.filters-row select,.filters-row input{
  padding:7.5px 11px; border:1px solid var(--border-strong); border-radius:9px; background:var(--surface-1); font-size:13px;
}
.filters-row .spacer{flex:1}
.count-note{font-size:12px; color:var(--ink-3)}

.empty{padding:38px 20px; text-align:center; color:var(--ink-3)}
.empty b{display:block; color:var(--ink-2); font-size:14.5px; margin-bottom:4px}

.toast-zone{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:9px; max-width:360px}
.toast{
  background:var(--surface-1); border:1px solid var(--border); border-left:4px solid var(--good);
  border-radius:10px; box-shadow:var(--shadow-lg); padding:12px 16px; font-size:13px;
  animation:slidein .25s ease;
}
.toast.warn{border-left-color:var(--warning)} .toast.err{border-left-color:var(--critical)} .toast.info{border-left-color:var(--s1)}
.toast b{display:block; margin-bottom:1px}
.toast span{color:var(--ink-2); font-size:12.5px}
@keyframes slidein{from{transform:translateX(30px); opacity:0} to{transform:none; opacity:1}}

.modal-back{
  position:fixed; inset:0; background:rgba(8,10,14,.5); z-index:100;
  display:none; align-items:flex-start; justify-content:center; padding:4vh 16px; overflow-y:auto;
  backdrop-filter:blur(2px);
}
.modal-back.on{display:flex}
.modal{
  background:var(--surface-1); border-radius:16px; box-shadow:var(--shadow-lg);
  width:min(760px,100%); animation:pop .18s ease; border:1px solid var(--border);
}
.modal.sm{width:min(480px,100%)} .modal.lg{width:min(980px,100%)}
@keyframes pop{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}
.modal-head{display:flex; align-items:center; gap:12px; padding:18px 22px 0}
.modal-head h3{font-size:17px}
.modal-head .x{margin-left:auto}
.modal-body{padding:16px 22px 22px}
.modal-foot{display:flex; gap:10px; justify-content:flex-end; padding:0 22px 20px}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--grid); margin-bottom:16px; overflow-x:auto}
.tab{padding:9px 15px; font-weight:600; font-size:13px; color:var(--ink-2); border-bottom:2px solid transparent; white-space:nowrap}
.tab:hover{color:var(--ink-1)}
.tab.active{color:var(--brand); border-bottom-color:var(--seq-450)}

.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px}
.form-grid .full{grid-column:1/-1}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
fieldset.fs{border:1px solid var(--border); border-radius:12px; padding:14px 16px 16px; margin-bottom:14px}
fieldset.fs legend{font-size:12px; font-weight:750; color:var(--brand); padding:0 7px; letter-spacing:.4px; text-transform:uppercase}
.check-row{display:flex; flex-wrap:wrap; gap:8px}
.checkbox-pill{position:relative}
.checkbox-pill input{position:absolute; opacity:0; inset:0; cursor:pointer}
.checkbox-pill span{
  display:inline-block; padding:6px 13px; border-radius:99px; border:1px solid var(--border-strong);
  font-size:12.5px; font-weight:550; color:var(--ink-2); transition:.12s;
}
.checkbox-pill input:checked + span{background:var(--seq-550); border-color:var(--seq-550); color:#fff}
.checkbox-pill input:focus-visible + span{outline:2px solid var(--s1); outline-offset:2px}
.hint{font-size:11.5px; color:var(--ink-3); margin-top:4px}
.err-text{font-size:12px; color:var(--critical); font-weight:600; margin-top:4px}
.invalid input,.invalid select,.invalid textarea{border-color:var(--critical)}

.steps{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap}
.step-pill{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink-3); padding:5px 11px; border-radius:99px; background:var(--wash)}
.step-pill .n{width:19px;height:19px;border-radius:50%;background:var(--axisline);color:var(--surface-1);display:grid;place-items:center;font-size:11px;font-weight:800}
.step-pill.cur{color:var(--brand); background:color-mix(in srgb, var(--seq-450) 12%, transparent)}
.step-pill.cur .n{background:var(--seq-500); color:#fff}
.step-pill.done .n{background:var(--good)}

.timeline{position:relative; padding-left:26px}
.timeline::before{content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--grid); border-radius:2px}
.tl-item{position:relative; padding-bottom:16px}
.tl-item::before{content:""; position:absolute; left:-24px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--seq-450); border:2.5px solid var(--surface-1); box-shadow:0 0 0 1px var(--grid)}
.tl-item .tl-title{font-weight:650; font-size:13px}
.tl-item .tl-meta{font-size:11.5px; color:var(--ink-3)}
.tl-item .tl-body{font-size:12.5px; color:var(--ink-2); margin-top:3px}

.alert-item{display:flex; gap:13px; padding:13px 16px; border-bottom:1px solid var(--grid); align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-item .ai-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert-item .ai-t{font-weight:650; font-size:13.5px}
.alert-item .ai-d{font-size:12.5px; color:var(--ink-2); margin-top:1px}
.alert-item .ai-meta{font-size:11.5px; color:var(--ink-3); margin-top:3px}
.alert-item .ai-act{margin-left:auto; flex:none}

.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:10px}
.legend .li{display:flex; gap:6px; align-items:center}
.legend .sw{width:10px; height:10px; border-radius:3px}
.legend .swl{width:14px; height:3px; border-radius:2px}

.viz-tooltip{
  position:fixed; z-index:150; pointer-events:none; background:var(--ink-1); color:var(--page);
  font-size:12px; padding:7px 11px; border-radius:8px; box-shadow:var(--shadow-lg);
  opacity:0; transition:opacity .08s; max-width:260px;
}

/* ==================== UTILIDADES ==================== */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => new Intl.NumberFormat("es-CL").format(n);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const DAY = 864e5;
const hoy = () => new Date();
function fdate(d, withTime=false){
  if(!d) return "—";
  const x = (d instanceof Date) ? d : new Date(d);
  const f = x.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"});
  return withTime ? f + " " + x.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}) : f;
}
function fmes(d){ const x=(d instanceof Date)?d:new Date(d); return x.toLocaleDateString("es-CL",{month:"long",year:"numeric"}); }
const diasEntre = (a,b) => Math.floor(((b instanceof Date?b:new Date(b)) - (a instanceof Date?a:new Date(a)))/DAY);
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;

/* RNG determinista para datos demo estables */
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t>>>15, t | 1); t ^= t + Math.imul(t ^ t>>>7, t | 61); return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20260731);
const pick = arr => arr[Math.floor(rng()*arr.length)];
const rint = (a,b) => a + Math.floor(rng()*(b-a+1));

/* RUT chileno con dígito verificador válido */
function dvRut(num){ let M=0,S=1; for(;num;num=Math.floor(num/10)) S=(S+num%10*(9-M++%6))%11; return S ? String(S-1) : "K"; }
function rutDemo(){ const n = rint(9_000_000, 26_500_000); return fmtN(n)+"-"+dvRut(n); }
function normRut(r){ return String(r||"").replace(/[.\s]/g,"").toUpperCase(); }
function validaRut(r){
  const m = normRut(r).match(/^(\d{6,9})-?([\dK])$/); if(!m) return false;
  return dvRut(parseInt(m[1],10)) === m[2];
}

const INSTITUCIONES = ["CAJ Metropolitana","CAVD (SPD)","URAVIT Fiscalía","CESFAM / Salud Mental","SENDA Previene","SernamEG","Mejor Niñez","COSAM","Municipio · DIDECO","Hospital de referencia"];

/* ==================== EQUIPOS Y USUARIOS DEL SISTEMA ==================== */
const TRIADAS = Array.from({length:17},(_,i)=>{

const USUARIOS_SISTEMA = [
  {id:"u1", nombre:"Camila Torres A.",  rol:"profesional", cargo:"Psicóloga · Triada móvil 5",   perfil:"psicosocial", comunas:["La Pintana","San Ramón","La Granja"], color:"#2a78d6", ini:"CT", login:true,  activo:true},
  {id:"u2", nombre:"Andrés Fuentes M.", rol:"profesional", cargo:"Abogado · Triada móvil 5",     perfil:"juridico",    comunas:["La Pintana","San Ramón","La Granja"], color:"#4a3aa7", ini:"AF", login:false, activo:true},

  {id:"u4", nombre:"Daniela Vega L.",   rol:"secretaria",  cargo:"Equipo central del programa", perfil:"central", comunas:COMUNAS, color:"#008300", ini:"DV", login:true, activo:true},

/* ==================== BASE DE DATOS EN MEMORIA (demo) ==================== */

function nuevoCodigo(fecha){

}

/* Índice de priorización — puntaje automático (baremo demo, puntos 3 y 8 BT) */
function calculaPriorizacion(c){
  let pts = 0, detalle = [];
  const del = DELITOS.find(d=>d.id===c.delito);
  if(del){ pts += del.peso; detalle.push([del.n, del.peso]); }
  (c.situaciones||[]).forEach(s=>{ const sp = SIT_PRIORIZACION.find(x=>x.id===s); if(sp){ pts += sp.pts; detalle.push([sp.n, sp.pts]); } });
  (c.grupos||[]).forEach(()=>{ pts += 1; });
  if((c.grupos||[]).length) detalle.push(["Grupos prioritarios ("+c.grupos.length+")", c.grupos.length]);
  if(c.edad !== "" && c.edad != null){ if(c.edad >= 65){ pts += 2; detalle.push(["Persona de 65 o más años",2]); } else if(c.edad < 18){ pts += 3; detalle.push(["Menor de 18 años",3]); } }
  const nivel = pts >= 12 ? "Alta" : pts >= 7 ? "Media" : "Baja";
  return {pts, nivel, detalle};
}

function logAcceso(usuario, accion, detalle){

/* ---------- Semilla de datos demo (determinista) ---------- */
function pickPeso(pares){ /* [[valor, peso], ...] */
  const total = pares.reduce((a,p)=>a+p[1],0);
  let r = rng()*total;
  for(const [v,p] of pares){ r -= p; if(r<=0) return v; }
  return pares[0][0];
}
const PESO_COMUNA = {"Puente Alto":8,"La Pintana":8,"Santiago":7,"La Florida":6,"San Bernardo":6,"Maipú":5,"El Bosque":5,"San Ramón":5,"La Granja":5,"Lo Espejo":4,"Pudahuel":4,"Recoleta":4,"Cerro Navia":4,"Renca":3,"Quilicura":3,"Peñalolén":3,"Estación Central":3,"Conchalí":3,"Pedro Aguirre Cerda":3,"Independencia":2,"Quinta Normal":2,"Lo Prado":2,"San Joaquín":2,"San Miguel":2,"Macul":2,"Huechuraba":2,"Cerrillos":2,"La Cisterna":2,"Lampa":1,"Colina":1,"Padre Hurtado":1,"Peñaflor":1,"Melipilla":1,"Talagante":1,"Buin":1,"Paine":1};
const PESO_DELITO = {robo_violencia:29, robo_intimidacion:24, lesiones_graves:14, balacera:10, homicidio:7, homicidio_frustrado:6, secuestro:3, otro:7};
function seedDatos(){
  const N = 132;
  const ahora = new Date(2026,6,31,10,0);   // se re-basa a la fecha real más abajo
  const desfase = hoy() - ahora;            // corre todo el dataset hasta "hoy"
  for(let i=0;i<N;i++){
    const genero = pick(["Femenino","Femenino","Femenino","Masculino","Masculino","No binario"]);
    const nombre = (genero==="Femenino" ? pick(NOMBRES_F) : pick(NOMBRES_M)) + " " + pick(APELLIDOS) + " " + pick(APELLIDOS);
    const comuna = pickPeso(COMUNAS.map(c=>[c, PESO_COMUNA[c]||1]));
    const delito = pickPeso(DELITOS.map(d=>[d.id, PESO_DELITO[d.id]||1]));
    const haceDias = Math.floor(Math.pow(rng(), 1.35) * 128);   // más casos recientes
    const fDelito  = new Date(+ahora - (haceDias+rint(0,6))*DAY + desfase);
    const fDeriv   = new Date(+ahora - haceDias*DAY + rint(8,20)*36e5 + desfase);
    const grupos = GRUPOS_PRIORITARIOS.filter(()=>rng()<0.09).map(g=>g.id);
    const situaciones = SIT_PRIORIZACION.filter(()=>rng()<0.19).map(s=>s.id);
    const prof = rng()<0.5 ? USUARIOS_SISTEMA[0] : USUARIOS_SISTEMA[1];
    const c = {
      id:"c"+(i+1), codigo:null,
      nombre, rut: rutDemo(), edad: rint(15,84), genero,
      telefono: "+56 9 " + rint(3000,9999) + " " + String(rint(0,9999)).padStart(4,"0"),
      direccion: pick(CALLES) + " " + rint(40, 9800), comuna,
      email: rng()<0.6 ? nombre.split(" ")[0].toLowerCase()+rint(1,99)+"@correo.cl" : "",
      grupos, situaciones, delito,
      fechaDelito: fDelito, fechaDerivacion: fDeriv,
      canal: pick(CANALES),
      triage: rng()<0.16 ? "Urgencia" : (rng()<0.5 ? "Moderado" : "Leve"),
      responsable: null, comunaEquipo: comuna,
      estado:"derivado", historial:[], creado:fDeriv, actualizado:fDeriv,
      fichas:{psicosocial:null, juridico:null},
      sesiones:[], derivaciones:[], brechas:[],
      consent1Contacto:false, consent1Visita:false,
      egreso:null, satisfaccion:null, reingresos:0,
    };
    const pr = calculaPriorizacion(c); c.prioridad = pr;
    c.historial.push({estado:"derivado", t:fDeriv, por:"Sistema (canal: "+c.canal+")", nota:""});

    /* progresión del caso según antigüedad */
    const prog = rng();
    let cursor = new Date(+fDeriv);
    const avanza = (est, hrs, por, nota) => { cursor = new Date(+cursor + hrs*36e5); if(cursor > new Date()) return false; cambiarEstado(c, est, por, nota); c.historial[c.historial.length-1].t = new Date(+cursor); return true; };
    const pnom = prof.nombre;
    if(haceDias >= 1 && prog > 0.06){
      const hIng = c.prioridad.nivel==="Alta" ? rint(4,40) : rint(10,110);
      if(avanza("ingresado", hIng, pnom, "Primer contacto realizado")){
        c.consent1Contacto = true;
        c.responsable = prof.id;
        c.primeraAtencion = new Date(+cursor);
        if(haceDias >= 3 && prog > 0.16 && avanza("atencion", rint(24,96), pnom, "Inicio plan de intervención")){
          c.consent1Visita = rng() < 0.9;
          c.fichas.psicosocial = fichaDemo("psicosocial", pnom, cursor);
          if(rng()<0.55) c.fichas.juridico = fichaDemo("juridico", USUARIOS_SISTEMA[1].nombre, cursor);
          const nSes = rint(1,6);
          for(let s=0;s<nSes;s++){
            const fs = new Date(+cursor + (s+1)*rint(4,9)*DAY); if(fs > new Date()) break;
            c.sesiones.push({t:fs, tipo:pick(TIPOS_INTERVENCION), profesional: rng()<0.7?pnom:USUARIOS_SISTEMA[1].nombre, resultado:pick(["Realizada","Realizada","Realizada","Visita fallida","Reagendada"]), nota:"Registro de sesión de acompañamiento."});
          }

            const inst = pick(INSTITUCIONES);
            const fd = new Date(+cursor + rint(2,12)*DAY);
            if(fd <= new Date()) c.derivaciones.push({t:fd, institucion:inst, motivo:pick(["Atención reparatoria especializada","Patrocinio jurídico","Salud mental","Apoyo social"]), estado: rng()<0.7 ? "Concretada" : (rng()<0.5?"Pendiente":"No concretada"), folio:"DER-"+rint(1000,9999), por:pnom});
          }
          if(rng()<0.18){ c.brechas.push({t:new Date(+cursor+rint(3,10)*DAY), detalle:pick(["Sin cupo en COSAM comunal","Lista de espera CAJ superior a 30 días","Sin oferta reparatoria para NNA en la comuna"]), por:USUARIOS_SISTEMA[2].nombre}); if(rng()<0.55 && prog<=0.35) cambiarEstado(c,"brecha",USUARIOS_SISTEMA[2].nombre,"Brecha de oferta registrada — caso en espera de cupo"); }
          if(haceDias >= 12 && prog > 0.35 && avanza("seguimiento", rint(120,360), pnom, "Plan en seguimiento")){
            if(haceDias >= 25 && prog > 0.55){
              const eg = pick(EGRESOS);
              if(avanza(eg.id===4 ? "egreso_adm" : "cerrado", rint(150,500), pnom, "Egreso: "+eg.n)){
                c.egreso = {tipo:eg.id, glosa:eg.n, t:new Date(+cursor), informe:true};
                if(eg.encuesta && rng()<0.8){ c.satisfaccion = rint(4,7); DB.encuestas.push({caso:c.id, nota:c.satisfaccion, t:new Date(+cursor+2*DAY)}); }
                if(rng()<0.08){ avanza("reingreso", rint(300,900), "Sistema", "Reingreso por nueva victimización"); c.reingresos = 1; }
              }
            }
          }
        }
      }
    }
    c.codigo = nuevoCodigo(c.fechaDerivacion);
    DB.casos.push(c);
  }
  /* garantiza casos en bandeja (derivados sin responsable) en las comunas de la triada demo */
  const zonaDemo = ["La Pintana","San Ramón","La Granja"];
  let enZona = DB.casos.filter(c=>c.estado==="derivado" && zonaDemo.includes(c.comuna)).length;
  for(const c of DB.casos){
    if(enZona>=3) break;
    if(c.estado==="derivado" && !zonaDemo.includes(c.comuna)){ c.comuna = zonaDemo[enZona%3]; enZona++; }
  }
  DB.casos.sort((a,b)=> b.fechaDerivacion - a.fechaDerivacion);
}
function fichaDemo(tipo, prof, base){
  return {
    completa:true, profesional:prof, t:new Date(+base + rint(1,3)*DAY),
    evaluacion: tipo==="psicosocial" ? "Sintomatología ansiosa post evento. Red familiar presente parcial." : "Causa vigente en Fiscalía local. Requiere orientación en medidas de protección.",
    intervencion: tipo==="psicosocial" ? "Primeros auxilios psicológicos" : "Orientación jurídica",
    plan:{sesiones:rint(3,8), foco: tipo==="psicosocial" ? "Estabilización emocional y activación de red" : "Acompañamiento al proceso penal"},
  };
}

const S = { user:null, vista:"dashboard", casoAbierto:null, offline:false, filtros:{}, tema:null, alertasVistas:false };

function comunasDe(u){ return u.rol==="secretaria" ? COMUNAS : u.comunas; }
function casosVisibles(u=S.user){
  if(!u) return [];
  let cs = DB.casos.filter(c => comunasDe(u).includes(c.comuna));
  if(u.rol==="profesional") cs = cs.filter(c => c.responsable===u.id || comunasDe(u).includes(c.comuna));
  return cs;
}

/* ==================== ALERTAS AUTOMÁTICAS (punto 2.5 BT) ==================== */
function calcAlertas(u=S.user){
  const out = []; const ahora = hoy();
  /* punto 2.4: el Profesional recibe alertas de SUS casos; coordinación y secretaría, de sus comunas */
  let cs = casosVisibles(u);
  if(u && u.rol==="profesional") cs = cs.filter(c => c.responsable===u.id);
  for(const c of cs){
    const hrsDeriv = (ahora - c.fechaDerivacion)/36e5;
    /* a) gestión */
    if(c.estado==="derivado" && hrsDeriv > 48)
      out.push({cat:"gestion", sev: hrsDeriv>96 ? "critical":"serious", t:"Retraso en ingreso", d:`Derivado hace ${Math.floor(hrsDeriv/24)} días sin primer contacto`, caso:c});
    if(c.estado==="ingresado" && !c.primeraAtencionOK && hrsDeriv > ESTANDAR_PRIMERA_ATENCION_HRS && !c.primeraAtencion)
      out.push({cat:"gestion", sev:"serious", t:"Retraso en atención", d:`Supera el estándar de ${ESTANDAR_PRIMERA_ATENCION_HRS} h para primera atención`, caso:c});
    if(["ingresado","atencion","seguimiento"].includes(c.estado) && diasEntre(c.actualizado, ahora) > DIAS_SIN_ACTUALIZAR)
      out.push({cat:"gestion", sev:"warning", t:"Caso sin actualización", d:`${diasEntre(c.actualizado, ahora)} días sin registros`, caso:c});
    /* b) criticidad */
    if(c.prioridad.nivel==="Alta" && !["cerrado","egreso_adm"].includes(c.estado))
      out.push({cat:"criticidad", sev:"critical", t:"Caso de alta priorización", d:`Índice ${c.prioridad.pts} pts — requiere atención prioritaria`, caso:c});
    if(c.triage==="Urgencia" && !["cerrado","egreso_adm"].includes(c.estado))
      out.push({cat:"criticidad", sev:"critical", t:"Urgencia según triage psicológico", d:"Triage de primera respuesta arroja urgencia", caso:c});
    /* c) seguimiento */
    if(c.estado==="reingreso")
      out.push({cat:"seguimiento", sev:"serious", t:"Reingreso de caso cerrado", d:"Nueva victimización sobre caso previamente cerrado", caso:c});
    if(c.estado==="egreso_adm" && diasEntre(c.actualizado, ahora) < 20)
      out.push({cat:"seguimiento", sev:"warning", t:"Pérdida de contacto", d:"Egreso administrativo por intentos fallidos documentados", caso:c});
    c.derivaciones.filter(d=>d.estado==="No concretada").forEach(d=>
      out.push({cat:"seguimiento", sev:"serious", t:"Derivación no concretada", d:`${d.institucion} — requiere reactivación`, caso:c}));
    c.derivaciones.filter(d=>d.estado==="Pendiente" && diasEntre(d.t, ahora)>10).forEach(d=>
      out.push({cat:"seguimiento", sev:"warning", t:"Derivación pendiente", d:`${d.institucion} sin confirmación hace ${diasEntre(d.t,ahora)} días`, caso:d.caso||c}));
  }
  const sevOrder = {critical:0, serious:1, warning:2};
  out.sort((a,b)=> sevOrder[a.sev]-sevOrder[b.sev]);
  return out;
}

/* ==================== MINI LIBRERÍA DE GRÁFICOS SVG ====================
   Especificación de marcas: barras ≤24px con extremo redondeado 4px,
   líneas 2px, marcadores ≥8px con anillo de superficie, grillas hairline. */
const PAL = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];

function niceMax(v){ if(v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; const m = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function ticks(max, n=4){ const out=[]; for(let i=0;i<=n;i++) out.push(Math.round(max*i/n)); return [...new Set(out)]; }

/* Barras horizontales (ranking) */
function chartBarsH(data, {color="var(--s1)", height=null, unidad="", labelW=118}={}){
  const rowH = 30, gap = 8, w = 560;
  const max = niceMax(Math.max(...data.map(d=>d.v), 1));
  const bw = w - labelW - 58;
  const h = data.length * (rowH) + 6;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de barras">`;
  data.forEach((d,i)=>{
    const y = i*rowH + 5;
    const len = Math.max(4, d.v/max * bw);
    const col = d.color || color;
    const maxCh = Math.floor(labelW/6.4);
    s += `<text x="${labelW-8}" y="${y+13}" text-anchor="end" font-size="11.5" fill="var(--ink-2)">${esc(d.n.length>maxCh? d.n.slice(0,maxCh-1)+"…" : d.n)}</text>`;
    s += `<path d="M ${labelW} ${y} h ${len-4} a4 4 0 0 1 4 4 v ${12} a4 4 0 0 1 -4 4 h -${len-4} z" fill="${col}" class="mark" data-tt="${esc(d.n)}|${fmtN(d.v)}${unidad}"></path>`;
    s += `<text x="${labelW + len + 7}" y="${y+14}" font-size="11.5" font-weight="650" fill="var(--ink-1)">${fmtN(d.v)}${unidad}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* Columnas verticales, series única o apiladas */
function chartCols(data, {series=null, colors=PAL, height=210, unidad=""}={}){
  const w=560, h=height, padL=38, padB=24, padT=12;
  const innerW = w-padL-10, innerH = h-padB-padT;
  const totales = data.map(d => series ? series.reduce((a,s)=>a+(d[s.k]||0),0) : d.v);
  const max = niceMax(Math.max(...totales,1));
  const n = data.length;
  const slot = innerW/n;
  const bw = Math.min(24, slot*0.62);
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de columnas">`;
  ticks(max).forEach(t=>{
    const y = padT + innerH - t/max*innerH;
    s += `<line x1="${padL}" y1="${y}" x2="${w-8}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${fmtN(t)}</text>`;
  });
  data.forEach((d,i)=>{
    const cx = padL + slot*i + slot/2;
    let acumY = padT + innerH;
    if(series){
      series.forEach((sr,si)=>{
        const v = d[sr.k]||0; if(!v) return;
        const bh = v/max*innerH;
        const y = acumY - bh;
        const esTope = si === series.length-1 || series.slice(si+1).every(x=>!(d[x.k]||0));
        const r = esTope ? 4 : 0;
        s += `<path d="M ${cx-bw/2} ${y+r} a ${r} ${r} 0 0 1 ${r} -${r} h ${bw-2*r} a ${r} ${r} 0 0 1 ${r} ${r} v ${Math.max(bh-r-1.2,0)} h -${bw} z" fill="${colors[si]}" class="mark" data-tt="${esc(d.n)} · ${esc(sr.n)}|${fmtN(v)}${unidad}"/>`;
        acumY = y - 2; /* separador de superficie 2px */
      });
    } else {
      const bh = Math.max(d.v/max*innerH, d.v?3:0);
      const y = padT + innerH - bh;
      s += `<path d="M ${cx-bw/2} ${y+4} a4 4 0 0 1 4 -4 h ${bw-8} a4 4 0 0 1 4 4 v ${Math.max(bh-4,0)} h -${bw} z" fill="${d.color||colors[0]}" class="mark" data-tt="${esc(d.n)}|${fmtN(d.v)}${unidad}"/>`;
    }
    s += `<text x="${cx}" y="${h-7}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(d.n)}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* Línea de tendencia (1-2 series) con marcador final etiquetado */
function chartLine(data, {series=[{k:"v",n:"Serie"}], colors=PAL, height=210, unidad=""}={}){
  const w=560, h=height, padL=38, padB=24, padT=12, padR=44;
  const innerW = w-padL-padR, innerH = h-padB-padT;
  const max = niceMax(Math.max(...data.flatMap(d=>series.map(s=>d[s.k]||0)),1));
  const X = i => padL + (data.length===1 ? innerW/2 : innerW*i/(data.length-1));
  const Y = v => padT + innerH - v/max*innerH;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Gráfico de tendencia">`;
  ticks(max).forEach(t=>{
    s += `<line x1="${padL}" y1="${Y(t)}" x2="${w-padR+18}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL-6}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">${fmtN(t)}</text>`;
  });
  data.forEach((d,i)=>{ if(i%Math.ceil(data.length/8)===0 || i===data.length-1) s += `<text x="${X(i)}" y="${h-7}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(d.n)}</text>`; });
  series.forEach((sr,si)=>{
    const col = colors[si];
    const pts = data.map((d,i)=>`${X(i)},${Y(d[sr.k]||0)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    data.forEach((d,i)=>{
      s += `<circle cx="${X(i)}" cy="${Y(d[sr.k]||0)}" r="7.5" fill="transparent" class="mark" data-tt="${esc(d.n)} · ${esc(sr.n)}|${fmtN(d[sr.k]||0)}${unidad}"/>`;
    });
    const last = data[data.length-1];
    s += `<circle cx="${X(data.length-1)}" cy="${Y(last[sr.k]||0)}" r="4.5" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
    s += `<text x="${X(data.length-1)+8}" y="${Y(last[sr.k]||0)+4}" font-size="11" font-weight="650" fill="var(--ink-1)">${fmtN(last[sr.k]||0)}${unidad}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* Dona (composición, ≤4 categorías + Otros) */
function chartDonut(data, {size=170, grosor=26}={}){
  const total = data.reduce((a,d)=>a+d.v,0) || 1;
  const R = size/2 - 4, r = R - grosor, cx = size/2, cy = size/2;
  let ang = -Math.PI/2, s = `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%;height:auto" role="img" aria-label="Gráfico de composición">`;
  data.forEach((d,i)=>{
    const frac = d.v/total; if(frac<=0) return;
    const a2 = ang + frac*2*Math.PI - 0.028; /* separador */
    const x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    const x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
    const big = frac>0.5?1:0;
    s += `<path d="M ${x1} ${y1} A ${R} ${R} 0 ${big} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${d.color||PAL[i]}" class="mark" data-tt="${esc(d.n)}|${fmtN(d.v)} (${Math.round(frac*100)}%)"/>`;
    ang = a2 + 0.028;
  });
  s += `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink-1)">${fmtN(total)}</text>`;
  s += `<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">TOTAL</text>`;
  s += `</svg>`;
  return s;
}

function legendHtml(items){

}

/* Escala secuencial azul para mapa de calor */
function seqColor(v, max){
  const steps = ["#cde2fb","#b7d3f6","#9ec5f4","#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6","#256abf","#1c5cab","#184f95","#104281","#0d366b"];
  if(max<=0) return steps[0];
  const idx = Math.min(steps.length-1, Math.floor((v/max)*(steps.length-1)));
  return steps[idx];
}
function inkPara(bg){
  const r=parseInt(bg.slice(1,3),16), g=parseInt(bg.slice(3,5),16), b=parseInt(bg.slice(5,7),16);
  return (0.2126*r + 0.7152*g + 0.0722*b) > 150 ? "#0b0b0b" : "#ffffff";
}

function desempenoTriadas(u, cs){
  const propias = t => u.rol==="secretaria" || t.comunas.some(c=>comunasDe(u).includes(c));
  return TRIADAS.filter(propias).map(t=>{
    const cc = cs.filter(c=> t.comunas.includes(c.comuna));
    if(!cc.length) return null;
    const conAt = cc.filter(c=>c.primeraAtencion);
    return {
      n: t.n, comunas: t.comunas,
      total: cc.length,
      activos: cc.filter(c=>!["cerrado","egreso_adm"].includes(c.estado)).length,
      t1a: conAt.length ? conAt.reduce((a,c)=>a+(c.primeraAtencion-c.fechaDerivacion)/36e5,0)/conAt.length : null,
      cumpl: cumplimientoEstandar(cc),
      sesiones: cc.reduce((a,c)=>a+c.sesiones.length,0),
      sinAct: cc.filter(c=>!["cerrado","egreso_adm"].includes(c.estado) && diasEntre(c.actualizado,hoy())>DIAS_SIN_ACTUALIZAR).length,
    };
  }).filter(Boolean).sort((a,b)=>b.total-a.total).slice(0, u.rol==="secretaria" ? 10 : 6);
}
function medidor(n, v){
  const col = v>=80 ? "var(--good)" : v>=60 ? "var(--warning)" : "var(--critical)";
  const track = v>=80 ? "color-mix(in srgb, var(--good) 18%, transparent)" : v>=60 ? "color-mix(in srgb, var(--warning) 18%, transparent)" : "color-mix(in srgb, var(--critical) 15%, transparent)";
  return `<div style="margin-bottom:12px">
    <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px"><span style="color:var(--ink-2); font-weight:550">${esc(n)}</span><b style="font-variant-numeric:tabular-nums">${v}%</b></div>
    <div class="progressbar" style="background:${track}"><div style="width:${v}%; background:${col}"></div></div>
  </div>`;
}
function alertaHtml(a){
  return `<div class="alert-item">
    ${sevIcono(a.sev)}
    <div style="min-width:0">
      <div class="ai-t">${esc(a.t)} <span class="chip chip-outline" style="margin-left:4px">${SEV_N[a.sev]}</span></div>
      <div class="ai-d">${esc(a.d)}</div>
      <div class="ai-meta">${esc(a.caso.codigo)} · ${esc(a.caso.nombre)} · ${esc(a.caso.comuna)}</div>
    </div>
    <button class="btn btn-ghost ai-act" onclick="abreCaso('${a.caso.id}')">Abrir caso</button>
  </div>`;
}
function tiempoPromedioPrimeraAtencion(cs){
  const con = cs.filter(c=>c.primeraAtencion);
  if(!con.length) return 0;
  return con.reduce((a,c)=> a + (c.primeraAtencion - c.fechaDerivacion)/DAY, 0)/con.length;
}
function cumplimientoEstandar(cs){
  const con = cs.filter(c=>c.primeraAtencion);
  if(!con.length) return 0;
  return pct(con.filter(c=> (c.primeraAtencion - c.fechaDerivacion)/36e5 <= ESTANDAR_PRIMERA_ATENCION_HRS).length, con.length);
}

function tomaCaso(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  c.responsable = S.user.id; c.actualizado = new Date();
  c.historial.push({estado:c.estado, t:new Date(), por:S.user.nombre, nota:"Caso tomado desde la bandeja — responsable asignado"});
  logAcceso(S.user, "Toma de caso", c.codigo);
  registraOperacion("Toma "+c.codigo);
  toast("Caso "+c.codigo+" asignado a ti", "Registra el primer contacto y el consentimiento para ingresarlo.");
  abreCaso(id);
}

        <h3>Índice de priorización</h3><div class="card-sub">Se calcula automáticamente según el baremo del programa (puntos 3 y 8, Bases Técnicas)</div>
        <div id="prio-preview">
          <div class="st-value" style="font-size:34px">— <span style="font-size:14px; color:var(--ink-3)">pts</span></div>
          <div class="hint">Completa delito y situaciones para calcular.</div>
        </div>
        <hr style="border:none; border-top:1px solid var(--grid); margin:14px 0">
        <div class="hint">${I.shield} El código único de caso se genera al registrar y permite trazabilidad en todo el sistema. Los campos marcados con * son obligatorios: el sistema impide avanzar sin ellos.</div>
      </div>
    </div>
  </div>
  </form>`;

  const form = $("#form-caso");
  const preview = ()=>{
    const c = leeFormCaso(false);
    const p = calculaPriorizacion(c);
    const col = p.nivel==="Alta"?"var(--critical)":p.nivel==="Media"?"var(--serious)":"var(--good)";
    $("#prio-preview").innerHTML = `
      <div class="st-value" style="font-size:34px">${p.pts} <span style="font-size:14px; color:var(--ink-3)">pts</span></div>
      <div style="margin:6px 0 10px"><span class="chip" style="background:color-mix(in srgb, ${col} 12%, transparent); color:${col}; border-color:color-mix(in srgb, ${col} 30%, transparent)">Priorización ${p.nivel}</span></div>
      ${p.detalle.length?`<div style="font-size:12px; color:var(--ink-2)">${p.detalle.map(d=>`<div style="display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--grid)"><span>${esc(d[0])}</span><b>+${d[1]}</b></div>`).join("")}</div>`:`<div class="hint">Sin factores registrados aún.</div>`}
      ${p.nivel==="Alta"?`<div class="banner crit" style="margin:12px 0 0; padding:9px 12px"><span><b style="display:inline">Alerta automática:</b> el caso ingresará con prioridad alta y notificará a la triada.</span></div>`:""}`;
  };
  form.addEventListener("input", preview);
  form.addEventListener("change", preview);
  form.onsubmit = (e)=>{
    e.preventDefault();
    const req = [["f-nombre","Nombre"],["f-rut","RUT"],["f-edad","Edad"],["f-genero","Género"],["f-fono","Teléfono"],["f-dir","Dirección"],["f-comuna","Comuna"],["f-delito","Tipo de delito"],["f-fdelito","Fecha del delito"],["f-fderiv","Fecha de derivación"],["f-canal","Canal"]];
    let falta = [];
    req.forEach(([id,n])=>{
      const f = $("#"+id); const ok = f.value.trim()!=="";
      f.closest(".field").classList.toggle("invalid", !ok);
      if(!ok) falta.push(n);
    });
    if(falta.length){ toast("Faltan campos obligatorios", falta.join(", "), "err"); return; }
    if(!validaRut($("#f-rut").value) && /^[0-9.]+-?[\dkK]$/.test($("#f-rut").value.trim())){ $("#f-rut").closest(".field").classList.add("invalid"); toast("RUT inválido","Revisa el dígito verificador.","err"); return; }
    if(!$("#f-consent").checked){ toast("Consentimiento requerido","Debes registrar el consentimiento informado de primer contacto.","err"); return; }
    const c = leeFormCaso(true);
    c.prioridad = calculaPriorizacion(c);
    c.historial.push({estado:"derivado", t:new Date(), por:S.user.nombre, nota:"Ingreso manual · canal "+c.canal});
    cambiarEstado(c, "ingresado", S.user.nombre, "Registro con consentimiento de primer contacto");
    c.primeraAtencion = new Date();
    DB.casos.unshift(c);
    logAcceso(S.user, "Ingreso de caso", c.codigo+" · "+c.comuna);
    registraOperacion("Ingreso "+c.codigo);
    toast("Caso registrado: "+c.codigo, "Índice de priorización "+c.prioridad.nivel+" ("+c.prioridad.pts+" pts). "+(c.prioridad.nivel==="Alta"?"Se generó alerta de criticidad.":""));
    abreCaso(c.id);
  };
}
function leeFormCaso(final){
  const v = id => ($("#"+id)?.value||"").trim();
  const c = {
    id: final ? "c"+(DB.casos.length+1)+"-"+Date.now().toString(36) : "tmp",
    codigo: null,
    nombre: v("f-nombre"), rut: v("f-rut"), edad: v("f-edad")?parseInt(v("f-edad"),10):"", genero: v("f-genero"),
    telefono: v("f-fono"), email: v("f-mail"), direccion: v("f-dir"), comuna: v("f-comuna"),
    grupos: $$("input[name=grupo]:checked").map(x=>x.value),
    situaciones: $$("input[name=sit]:checked").map(x=>x.value),
    delito: v("f-delito"), canal: v("f-canal"), triage: v("f-triage")||"Leve",
    fechaDelito: v("f-fdelito")?new Date(v("f-fdelito")+"T12:00"):null,
    fechaDerivacion: v("f-fderiv")?new Date(v("f-fderiv")+"T12:00"):new Date(),
    responsable: S.user.id, estado:"derivado", historial:[], creado:new Date(), actualizado:new Date(),
    fichas:{psicosocial:null,juridico:null}, sesiones:[], derivaciones:[], brechas:[],
    consent1Contacto:true, consent1Visita:false, egreso:null, satisfaccion:null, reingresos:0,
    primeraAtencion:null,
  };
  if(final) c.codigo = nuevoCodigo(c.fechaDerivacion||new Date());
  return c;
}

    <div class="modal-foot"><button class="btn btn-secondary" onclick="cierraModal()">Cancelar</button><button class="btn btn-primary" id="ff-save">Guardar ficha</button></div>`);

    const eva=$("#ff-eval").value.trim(), int=$("#ff-int").value, nses=parseInt($("#ff-nses").value,10), foco=$("#ff-foco").value.trim();

function cargaXLSX(){

async function procesaArchivo(file){
  const out = $("#carga-result");
  out.innerHTML = `<div class="banner info" style="margin-top:16px"><div><b>Procesando ${esc(file.name)}…</b><span>Validando estructura y contenido contra la plantilla.</span></div></div>`;
  let filas = [];
  try{
    if(/\.csv$/i.test(file.name)){
      const txt = await file.text();
      filas = parseCSV(txt);
    } else {
      const lib = await cargaXLSX();
      if(!lib){ out.innerHTML = `<div class="banner warn" style="margin-top:16px"><div><b>Sin conexión al lector de Excel</b><span>No se pudo cargar la librería XLSX (CDN). Usa la plantilla CSV o reintenta con conexión.</span></div></div>`; return; }
      const buf = await file.arrayBuffer();
      const wb = lib.read(buf, {type:"array", cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      filas = lib.utils.sheet_to_json(ws, {defval:"", raw:false});
    }
  } catch(err){
    out.innerHTML = `<div class="banner crit" style="margin-top:16px"><div><b>No se pudo leer el archivo</b><span>${esc(err.message)}</span></div></div>`; return;
  }
  if(!filas.length){ out.innerHTML = `<div class="banner warn" style="margin-top:16px"><div><b>Archivo vacío</b><span>No se encontraron filas de datos.</span></div></div>`; return; }
  const {validas, errores} = validaFilas(filas);
  out.innerHTML = `
    <div class="grid g-3" style="margin-top:16px; margin-bottom:14px">
      <div class="card stat-tile" style="box-shadow:none"><span class="st-label">Filas leídas</span><span class="st-value" style="font-size:24px">${fmtN(filas.length)}</span></div>
      <div class="card stat-tile" style="box-shadow:none"><span class="st-label">Válidas</span><span class="st-value" style="font-size:24px; color:var(--good-text)">${fmtN(validas.length)}</span></div>
      <div class="card stat-tile" style="box-shadow:none"><span class="st-label">Con inconsistencias</span><span class="st-value" style="font-size:24px; color:${errores.length?"var(--critical)":"var(--good-text)"}">${fmtN(errores.length)}</span></div>
    </div>
    ${errores.length?`
    <h3 style="font-size:13.5px; margin-bottom:8px">Reporte de inconsistencias (previo a la carga definitiva)</h3>
    <div class="table-scroll" style="max-height:260px; overflow-y:auto; border:1px solid var(--grid); border-radius:10px">
      <table class="dt"><thead><tr><th>Fila</th><th>Campo</th><th>Problema</th><th>Valor</th></tr></thead><tbody>
        ${errores.slice(0,120).map(e=>`<tr><td class="num">${e.fila}</td><td><code>${esc(e.campo)}</code></td><td style="color:var(--critical)">${esc(e.problema)}</td><td style="color:var(--ink-2)">${esc(String(e.valor).slice(0,40))}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div style="display:flex; gap:8px; margin-top:10px"><button class="btn btn-ghost" onclick="descargaErrores()">${I.descarga} Descargar reporte de inconsistencias</button></div>`:""}
    <div style="display:flex; gap:10px; margin-top:16px; align-items:center">
      <button class="btn btn-primary" id="btn-confirma-carga" ${validas.length?"":"disabled"}>Confirmar carga de ${fmtN(validas.length)} caso(s) válido(s)</button>
      <span class="hint">Las filas con inconsistencias no se cargan; corrígelas y vuelve a importar.</span>
    </div>`;
  window._cargaPendiente = {validas, errores};
  $("#btn-confirma-carga").onclick = ()=>{
    const {validas} = window._cargaPendiente;
    validas.forEach(v=>{ DB.casos.unshift(v); });
    logAcceso(S.user, "Carga masiva", validas.length+" casos importados desde "+file.name);

  };
}
function parseCSV(txt){
  const sep = txt.includes(";") && !txt.split("\n")[0].includes(",") ? ";" : ",";
  const lineas = txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const head = lineas[0].split(sep).map(h=>h.trim().toLowerCase());
  return lineas.slice(1).map(l=>{
    const vals = l.split(sep); const o = {};
    head.forEach((h,i)=> o[h] = (vals[i]||"").trim());
    return o;
  });
}
function validaFilas(filas){
  const validas = [], errores = [];
  const rutsExistentes = new Set(DB.casos.map(c=>normRut(c.rut)));
  const rutsArchivo = new Set();
  filas.forEach((f,idx)=>{
    const nf = idx+2; /* fila en el archivo, contando encabezado */
    const g = k => String(f[k] ?? f[k?.toUpperCase()] ?? "").trim();
    const errsFila = [];
    const nombre = g("nombre"), rut = g("rut"), comuna = g("comuna");
    if(!nombre) errsFila.push({campo:"nombre", problema:"Obligatorio vacío", valor:""});
    if(!rut) errsFila.push({campo:"rut", problema:"Obligatorio vacío", valor:""});
    else if(/^[0-9.\s]+-?[\dkK]$/.test(rut) && !validaRut(rut)) errsFila.push({campo:"rut", problema:"Dígito verificador inválido", valor:rut});
    else if(rutsExistentes.has(normRut(rut)) ) errsFila.push({campo:"rut", problema:"Ya existe un caso con este RUT (posible duplicado)", valor:rut});
    else if(rutsArchivo.has(normRut(rut))) errsFila.push({campo:"rut", problema:"RUT duplicado dentro del archivo", valor:rut});
    const comunaOk = COMUNAS.find(c=>c.toLowerCase()===comuna.toLowerCase());
    if(!comunaOk) errsFila.push({campo:"comuna", problema:"Comuna no está entre las 36 priorizadas", valor:comuna});
    const delitoTx = g("tipo_delito");
    const delito = DELITOS.find(d=>d.n.toLowerCase()===delitoTx.toLowerCase() || d.id===delitoTx.toLowerCase());
    if(!delito) errsFila.push({campo:"tipo_delito", problema:"Delito no catalogado", valor:delitoTx});
    const edad = parseInt(g("edad"),10);
    if(g("edad") && (isNaN(edad)||edad<0||edad>120)) errsFila.push({campo:"edad", problema:"Edad fuera de rango", valor:g("edad")});
    const fDeriv = parseFecha(g("fecha_derivacion"));
    if(g("fecha_derivacion") && !fDeriv) errsFila.push({campo:"fecha_derivacion", problema:"Fecha ilegible (usar AAAA-MM-DD o DD-MM-AAAA)", valor:g("fecha_derivacion")});
    const fDel = parseFecha(g("fecha_delito"));
    if(errsFila.length){ errsFila.forEach(e=> errores.push({fila:nf, ...e})); return; }
    rutsArchivo.add(normRut(rut));
    const gruposTx = g("grupos_prioritarios").split(/[;,|]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
    const grupos = GRUPOS_PRIORITARIOS.filter(gp=> gruposTx.some(t=> gp.n.toLowerCase().includes(t)||gp.id===t)).map(gp=>gp.id);
    const sitTx = g("situaciones_priorizacion").split(/[;,|]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
    const situaciones = SIT_PRIORIZACION.filter(sp=> sitTx.some(t=> sp.n.toLowerCase().includes(t)||sp.id===t)).map(sp=>sp.id);
    const c = {
      id:"cm"+Date.now().toString(36)+idx, codigo:null,
      nombre, rut, edad: isNaN(edad)?"":edad, genero: g("genero")||"Prefiere no decir",
      telefono:g("telefono"), email:g("email"), direccion:g("direccion"), comuna:comunaOk,
      grupos, situaciones, delito:delito.id, canal:g("canal_derivacion")||"Carga masiva",
      triage:"Leve",
      fechaDelito:fDel||fDeriv||new Date(), fechaDerivacion:fDeriv||new Date(),
      responsable:S.user.id, estado:"derivado",
      historial:[{estado:"derivado", t:new Date(), por:S.user.nombre+" (carga masiva)", nota:""}],
      creado:new Date(), actualizado:new Date(),
      fichas:{psicosocial:null,juridico:null}, sesiones:[], derivaciones:[], brechas:[],
      consent1Contacto:false, consent1Visita:false, egreso:null, satisfaccion:null, reingresos:0, primeraAtencion:null,
    };
    c.prioridad = calculaPriorizacion(c);
    c.codigo = nuevoCodigo(c.fechaDerivacion);
    validas.push(c);
  });
  return {validas, errores};
}
function parseFecha(s){
  if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1], m[2]-1, +m[3], 12);
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return new Date(+m[3], m[2]-1, +m[1], 12);
  const d = new Date(s); return isNaN(d) ? null : d;
}

  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* ==================== VISTA: REPORTES MENSUALES (punto 2.7 BT) ==================== */
function indicadoresMes(cs, mkey){
  const delMes = cs.filter(c=> mesKey(c.fechaDerivacion)===mkey);
  const atendidos = delMes.filter(c=>c.primeraAtencion);
  const der = delMes.flatMap(c=>c.derivaciones);
  const cerrados = cs.filter(c=> c.egreso && mesKey(c.egreso.t)===mkey);
  const activosMes = cs.filter(c=> mesKey(c.fechaDerivacion)<=mkey && (!c.egreso || mesKey(c.egreso.t)>=mkey));
  return {
    ingresos: delMes.length,
    cobertura: pct(atendidos.length, delMes.length),
    coberturaMeta: Math.min(100, pct(delMes.length, Math.round(META_MENSUAL* (delMes.length? Math.max(delMes.length/ META_MENSUAL,0.001):0.001)) || 1)),
    tPrimera: tiempoPromedioPrimeraAtencion(delMes),
    tasaDerivacion: pct(der.filter(d=>d.estado==="Concretada").length, der.length||1),
    nDeriv: der.length,
    tasaCierre: pct(cerrados.length, activosMes.length||1),
    nCierres: cerrados.length,
    cumplimiento: cumplimientoEstandar(delMes),
    satisfaccion: (()=>{ const s = cerrados.filter(c=>c.satisfaccion); return s.length ? (s.reduce((a,c)=>a+c.satisfaccion,0)/s.length) : null; })(),
  };
}

function exportaReporteXLSX(mkey){
  const cs = casosVisibles();
  const ind = indicadoresMes(cs, mkey);
  const filas = [
    ["Programa Estamos Contigo — Reporte mensual", mkey],
    ["Generado", fdate(hoy(),true)],
    [],
    ["Indicador","Valor"],
    ["Casos ingresados", ind.ingresos],
    ["Cobertura del programa (%)", ind.cobertura],
    ["Tiempo promedio 1a atencion (dias)", ind.tPrimera?+ind.tPrimera.toFixed(1):""],
    ["Tasa de derivacion efectiva (%)", ind.tasaDerivacion],
    ["Tasa de cierre de casos (%)", ind.tasaCierre],
    ["Cumplimiento de estandares (%)", ind.cumplimiento],
    ["Satisfaccion usuaria (1-7)", ind.satisfaccion?+ind.satisfaccion.toFixed(1):""],
  ];
  cargaXLSX().then(lib=>{
    if(lib){
      const ws = lib.utils.aoa_to_sheet(filas); ws["!cols"]=[{wch:44},{wch:16}];
      const wb = lib.utils.book_new(); lib.utils.book_append_sheet(wb, ws, "Reporte "+mkey);
      lib.writeFile(wb, "reporte_mensual_"+mkey+".xlsx");
    } else descargaArchivo("reporte_mensual_"+mkey+".csv", filas.map(f=>f.join(";")).join("\n"));
    logAcceso(S.user,"Exportación de reporte", mkey);
    toast("Reporte exportado", "Reporte "+mkey+" generado.");
  });
}

function vTablero(el){

    const sat = cc.filter(c=>c.satisfaccion);

      comuna:cm, total:cc.length,
      cobertura: pct(conAt.length, cc.length),
      t1a: conAt.length ? (conAt.reduce((a,c)=>a+(c.primeraAtencion-c.fechaDerivacion)/36e5,0)/conAt.length) : null,

/* ---------- Gestión de usuarios (Secretaría Ejecutiva · punto 2.4.c + objetivo específico 2) ---------- */
function pillsComunas(seleccion){
  return COMUNAS.map(c=>`<label class="checkbox-pill"><input type="checkbox" name="uc" value="${esc(c)}" ${seleccion.includes(c)?"checked":""}><span>${esc(c)}</span></label>`).join("");
}
function modalUsuario(id){
  const u = id ? USUARIOS_SISTEMA.find(x=>x.id===id) : null;
  abreModal(`
    <div class="modal-head"><h3>${u?"Editar usuario":"Agregar usuario"}</h3><button class="icon-btn x" aria-label="Cerrar">${I.x}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label class="req" for="fu-nombre">Nombre completo</label><input id="fu-nombre" value="${esc(u?.nombre||"")}"></div>
        <div class="field"><label for="fu-cargo">Cargo</label><input id="fu-cargo" value="${esc(u?.cargo||"")}" placeholder="p. ej. Psicóloga · Triada móvil 3"></div>
        <div class="field"><label class="req" for="fu-rol">Perfil de acceso (punto 2.4 BT)</label>
          <select id="fu-rol" ${u&&u.id===S.user.id?"disabled":""}>
            <option value="profesional" ${u?.rol==="profesional"?"selected":""}>a) Profesional</option>
            <option value="coordinador" ${u?.rol==="coordinador"?"selected":""}>b) Coordinador/a institucional</option>
            <option value="secretaria" ${u?.rol==="secretaria"?"selected":""}>c) Secretaría Ejecutiva</option>
          </select></div>
        <div class="field" id="fu-disc-wrap"><label for="fu-disc">Disciplina (ficha que completa)</label>
          <select id="fu-disc"><option value="psicosocial" ${u?.perfil==="psicosocial"?"selected":""}>Psicosocial (psicólogo/a · trab. social)</option><option value="juridico" ${u?.perfil==="juridico"?"selected":""}>Jurídica (abogado/a)</option></select></div>
      </div>
      <fieldset class="fs" id="fu-comunas-wrap" style="margin-top:12px"><legend>Comunas asignadas</legend>
        <div class="check-row" style="max-height:180px; overflow-y:auto">${pillsComunas(u?.comunas||[])}</div>
        <div class="hint">La Secretaría Ejecutiva accede siempre a las 36 comunas; para los demás perfiles, esta selección define qué casos ven.</div>
      </fieldset>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="cierraModal()">Cancelar</button><button class="btn btn-primary" id="fu-save">${u?"Guardar cambios":"Crear usuario"}</button></div>`, {size:"lg"});
  const sync = ()=>{
    const rol = $("#fu-rol").value;
    $("#fu-disc-wrap").style.display = rol==="profesional" ? "" : "none";
    $("#fu-comunas-wrap").style.display = rol==="secretaria" ? "none" : "";
  };
  $("#fu-rol").onchange = sync; sync();
  $("#fu-save").onclick = ()=>{
    const nombre = $("#fu-nombre").value.trim();
    if(!nombre){ toast("Falta el nombre","El nombre completo es obligatorio.","err"); return; }
    const rol = $("#fu-rol").value;
    const comunas = $$("input[name=uc]:checked").map(x=>x.value);
    if(rol!=="secretaria" && !comunas.length){ toast("Sin comunas asignadas","Asigna al menos una comuna para este perfil.","err"); return; }
    if(u){
      u.nombre = nombre; u.ini = inicialesDe(nombre);
      u.cargo = $("#fu-cargo").value.trim() || u.cargo;
      if(u.id!==S.user.id) u.rol = rol;
      u.perfil = rol==="profesional" ? $("#fu-disc").value : (rol==="coordinador"?"coordinacion":"central");
      u.comunas = rol==="secretaria" ? COMUNAS : comunas;
      logAcceso(S.user, "Edición de usuario", nombre+" · "+ROLES[u.rol].n+" · "+(rol==="secretaria"?"36":comunas.length)+" comunas");
      toast("Usuario actualizado", nombre+" — los cambios de acceso rigen de inmediato.");
    } else {
      const nu = creaUsuario({nombre, rol, perfil: rol==="profesional" ? $("#fu-disc").value : null, cargo: $("#fu-cargo").value.trim(), comunas});
      logAcceso(S.user, "Alta de usuario", nu.nombre+" · "+ROLES[nu.rol].n+" · "+(rol==="secretaria"?"36":comunas.length)+" comunas");
      toast("Usuario creado: "+nu.nombre, "Ya puede iniciar sesión con el perfil "+ROLES[nu.rol].n+". Aparece en la pantalla de acceso.");
    }
    registraOperacion("Gestión de usuario");
    cierraModal(); renderApp();
  };
}
function toggleBloqueoUsuario(id){
  const u = USUARIOS_SISTEMA.find(x=>x.id===id); if(!u || u.id===S.user.id) return;
  u.activo = !u.activo;
  logAcceso(S.user, u.activo?"Usuario reactivado":"Usuario bloqueado", u.nombre);
  toast(u.activo?"Usuario reactivado":"Usuario bloqueado", u.nombre + (u.activo?" recupera su acceso.":" no podrá iniciar sesión hasta ser reactivado."), u.activo?"ok":"warn");
  renderApp();
}
async function importaNomina(file){
  if(!file) return;
  try{
    const filas = parseCSV(await file.text());
    let creados = 0, errores = [];
    filas.forEach((f,i)=>{
      const nombre = (f.nombre||"").trim();
      const rol = (f.rol||"profesional").trim().toLowerCase();
      if(!nombre){ errores.push("fila "+(i+2)+": sin nombre"); return; }
      if(!ROLES[rol]){ errores.push("fila "+(i+2)+": rol desconocido '"+rol+"'"); return; }
      const comunas = (f.comunas||"").split(",").map(x=>x.trim()).map(x=>COMUNAS.find(c=>c.toLowerCase()===x.toLowerCase())).filter(Boolean);
      if(rol!=="secretaria" && !comunas.length){ errores.push("fila "+(i+2)+": sin comunas válidas"); return; }
      creaUsuario({nombre, rol, perfil:(f.disciplina||"psicosocial").trim().toLowerCase()==="juridico"?"juridico":"psicosocial", cargo:(f.cargo||"").trim(), comunas});
      creados++;
    });
    logAcceso(S.user, "Carga de nómina", creados+" usuarios creados desde "+file.name+(errores.length?" · "+errores.length+" filas con error":""));
    toast("Nómina procesada", creados+" usuario(s) creados."+(errores.length?" "+errores.length+" fila(s) con error: "+errores.slice(0,3).join("; ")+(errores.length>3?"…":""):""), errores.length?"warn":"ok");
    renderApp();
  } catch(e){ toast("No se pudo leer la nómina", e.message, "err"); }
}
function modalTriada(id){
  const t = TRIADAS.find(x=>x.id===id); if(!t) return;
  abreModal(`
    <div class="modal-head"><h3>Asignación de comunas — ${esc(t.n)}</h3><button class="icon-btn x" aria-label="Cerrar">${I.x}</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:10px">Función exclusiva de la Secretaría Ejecutiva (punto 2.4.c BT): "asignación de comunas a supervisores y equipos". El cambio rige de inmediato y queda auditado.</p>
      <div class="check-row" style="max-height:220px; overflow-y:auto">${COMUNAS.map(c=>`<label class="checkbox-pill"><input type="checkbox" name="tc" value="${esc(c)}" ${t.comunas.includes(c)?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="cierraModal()">Cancelar</button><button class="btn btn-primary" id="ft-save">Guardar asignación</button></div>`);
  $("#ft-save").onclick = ()=>{
    const sel = $$("input[name=tc]:checked").map(x=>x.value);
    if(!sel.length){ toast("Sin comunas","Un equipo debe tener al menos una comuna asignada.","err"); return; }
    t.comunas = sel;
    logAcceso(S.user, "Asignación de comunas", t.n+" → "+sel.join(", "));
    registraOperacion("Asignación "+t.n);
    cierraModal(); toast("Asignación actualizada", t.n+" ahora cubre "+sel.length+" comuna(s)."); renderApp();
  };
}

/* ==================== VISTA: MANUAL DE USO ==================== */
function vManual(el){
  el.innerHTML = `
  <div class="page-head"><div><h2>Manual digital de uso operativo</h2><p class="pg-sub">Guía práctica para los 60 profesionales de las 17 triadas móviles</p></div>
  <div class="actions"><button class="btn btn-secondary" onclick="window.print()">${I.print} Descargar PDF</button></div></div>
  <div class="card card-pad help-article" style="max-width:860px">
    <h3>1 · Flujo general del caso</h3>
    <p>Todo caso sigue la ruta <b>Derivado al programa → Ingresado → En atención → En seguimiento → Cerrado</b>, con los estados complementarios <i>Egreso administrativo</i>, <i>Brechas</i> y <i>Reingreso</i>. Cada cambio de estado queda registrado con fecha, hora y profesional responsable.</p>
    <h3>2 · Ingresar un caso</h3>
    <ol>
      <li>Menú <b>Ingresar caso</b> → completa las 6 secciones. Los campos con asterisco son obligatorios: el sistema no permite registrar sin ellos.</li>
      <li>El <b>índice de priorización</b> se calcula solo, según delito, situaciones de priorización, grupos prioritarios y edad. Si resulta <b>Alta</b>, se genera alerta de criticidad para la triada.</li>
      <li>Registra el <b>consentimiento informado de primer contacto</b> antes de guardar. Al registrar se genera el <b>código único de caso</b> (EC-AAAA-NNNNN).</li>
    </ol>
    <h3>3 · Ficha de atención</h3>
    <p>Cada caso exige una <b>ficha estructurada</b> diferenciada por tipo de profesional (psicosocial y jurídico): consentimientos, evaluación inicial, tipo de intervención estandarizada, plan de acción con número de sesiones y registro de sesiones. <b>El sistema impide avanzar de etapa si la ficha obligatoria está incompleta.</b></p>
    <h3>4 · Sesiones y seguimiento</h3>
    <p>Registra cada contacto en la pestaña <b>Sesiones</b> (realizada, visita fallida, reagendada). Los casos sin actualización por más de ${DIAS_SIN_ACTUALIZAR} días generan alerta automática.</p>
    <h3>5 · Derivaciones</h3>
    <p>Desde la pestaña <b>Derivaciones</b> del caso: elige institución (CAJ, CAVD, salud, SENDA, etc.) y motivo. Se emite un folio con trazabilidad institucional. Marca la derivación como <b>Concretada</b> al confirmar la recepción; las no concretadas generan alerta.</p>
    <h3>6 · Egreso</h3>
    <p>Cuatro categorías: derivación efectiva, cumplimiento del plan con cierre técnico, egreso voluntario y egreso administrativo. En todos los casos se registra el tipo, se emite <b>informe interno de cierre</b> y —cuando es viable— se aplica la <b>encuesta de satisfacción</b> (escala 1 a 7).</p>
    <h3>7 · Trabajo sin conexión (modo offline)</h3>
    <p>Si pierdes señal en terreno, sigue trabajando: los registros se guardan en el dispositivo y el indicador superior muestra los pendientes. Al recuperar conexión, la plataforma <b>sincroniza automáticamente</b>.</p>
    <h3>8 · Perfiles y confidencialidad</h3>
    <ul>
      <li><b>Profesional:</b> ingresa casos, registra intervenciones, ve solo sus comunas asignadas y recibe alertas de sus casos.</li>
      <li><b>Coordinador/a:</b> además registra brechas, ve todos los casos e indicadores de sus comunas, panel y tablero de su zona.</li>
      <li><b>Secretaría Ejecutiva:</b> acceso total, asignación de comunas, reportes y administración.</li>
    </ul>
    <p>Los datos de las personas usuarias son <b>sensibles</b>: no compartas capturas ni exportaciones fuera de los canales institucionales. Todos los accesos quedan registrados.</p>
    <h3>9 · Soporte</h3>
    <p>Mesa de ayuda del proveedor: <code>soporte@plataforma-ec.cl</code> · Lun–Vie 08:00–19:00. Incidencias críticas 24/7, con resolución comprometida dentro de 48 h (SLA de las bases).</p>
  </div>`;
}
